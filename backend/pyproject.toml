[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "pydantic[email]>=2.9",
  "bcrypt>=4.2",
  "pyjwt>=2.9",
  "litellm>=1.52",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
